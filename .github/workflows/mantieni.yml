name: Mantieni attivo

# In un deposito pubblico GitHub spegne i lavori programmati se il deposito resta 60 giorni senza attività.
# Una volta al mese questo lavoro scrive la data in un file e la salva: basta perché "Aggiorna i GRIB" resti acceso.

on:
  schedule:
    - cron: "7 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mantieni:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%MZ" > .mantieni
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .mantieni
          git commit -m "Mantieni attivo: $(cat .mantieni)" && git push || echo "niente da salvare"
